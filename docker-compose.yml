services:
  postgres:
    image: postgres:16-alpine
    container_name: fervor-postgres
    environment:
      POSTGRES_DB: fervor
      POSTGRES_USER: fervor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fervor_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fervor -d fervor"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DATABASE_URL: postgresql://fervor:${POSTGRES_PASSWORD:-fervor_dev}@postgres:5432/fervor?schema=public
    container_name: fervor-backend
    environment:
      DATABASE_URL: postgresql://fervor:${POSTGRES_PASSWORD:-fervor_dev}@postgres:5432/fervor?schema=public
      NODE_ENV: development
      PORT: 3000
      CORS_ORIGIN: http://localhost:5500
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_me}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_dummy}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_dummy}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src:ro
      - ./frontend:/app/frontend:ro

volumes:
  postgres_data: