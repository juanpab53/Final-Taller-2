apiVersion: v1
kind: Secret
metadata:
  name: fervor-secrets
  namespace: fervor
  labels:
    app: fervor-bookstore
type: Opaque
stringData:
  # VALORES REALES - NO COMITEAR
  # Crear manualmente: kubectl create secret generic fervor-secrets -n fervor \
  #   --from-literal=DATABASE_URL=postgresql://postgres:<password>@postgres-svc:5432/ecommerce_books?schema=public \
  #   --from-literal=JWT_SECRET=<32-char-random> \
  #   --from-literal=STRIPE_SECRET_KEY=sk_test_... \
  #   --from-literal=STRIPE_WEBHOOK_SECRET=whsec_... \
  #   --from-literal=POSTGRES_PASSWORD=<password>
  DATABASE_URL: "postgresql://postgres:CHANGE_ME@postgres-svc:5432/ecommerce_books?schema=public"
  JWT_SECRET: "CHANGE_ME_32_chars_minimum"
  STRIPE_SECRET_KEY: "sk_test_CHANGE_ME"
  STRIPE_WEBHOOK_SECRET: "whsec_CHANGE_ME"
  POSTGRES_PASSWORD: "CHANGE_ME"
